name: Sonda de fuentes

# No escribe nada en el repositorio: solo averigua qué fuentes existen de
# verdad y deja el resultado en el registro del job.
on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sonda.mjs
