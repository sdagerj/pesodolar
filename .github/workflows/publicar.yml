name: Publicar en GitHub Pages

# Cada push a main republica el sitio. También se puede lanzar a mano
# desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si hay dos publicaciones seguidas, no se pisan entre sí
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true activa Pages solo, sin tener que tocar Settings
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # La app es estática: se sube la raíz del repositorio tal cual
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: despliegue
        uses: actions/deploy-pages@v4
